[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermex-ble"
version = "0.1.0"
description = "Unofficial BLE library for Thermex range hoods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stefan Rydning" }]
keywords = ["thermex", "ble", "bluetooth", "home-assistant", "range-hood"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.urls]
Homepage = "https://github.com/zhimishi/thermex-ble"
Issues = "https://github.com/zhimishi/thermex-ble/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thermex_ble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
